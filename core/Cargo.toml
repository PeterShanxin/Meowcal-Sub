[package]
name = "meowcal-core"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "meowcal_core"
path = "src/lib.rs"

[[bin]]
name = "meowcal-core"
path = "src/main.rs"

[features]
default = ["ppocr"]
# PP-OCRv6 recognition. Consumers that link only Core's protocol types turn it
# off to skip compiling the inference runtime and embedding the models.
ppocr = ["dep:rten", "dep:rten-tensor"]

[dependencies]
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }
rten = { version = "0.27", optional = true, default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_DXCore",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
windows-version = "0.100"
windows-future = "0.3"

[dev-dependencies]
png = "0.18"
tokio = { version = "1", features = ["test-util"] }

# Unoptimized inference makes PP-OCR tests take minutes; optimize the runtime
# even in test builds. Core's own code stays a normal debug build.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
