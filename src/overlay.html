<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="overlay.controls">Translation controls</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/controls.css">
    <link rel="stylesheet" href="styles/overlay.css">
    <link rel="stylesheet" href="styles/overlay-settings.css">
    <link rel="stylesheet" href="styles/overlay-theme.css">
    <link rel="stylesheet" href="styles/overlay-session-status.css">
</head>
<body>
    <!--
        This overlay window is fullscreen and transparent.
        It displays:
        1. A frame around the capture region
        2. Translated subtitles near the capture region
    -->

    <!-- Capture region frame -->
    <div id="capture-frame" class="capture-frame hidden">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <!-- 8 Resize handles (appear on hover) -->
        <div class="resize-handle" data-position="nw"></div>
        <div class="resize-handle" data-position="n"></div>
        <div class="resize-handle" data-position="ne"></div>
        <div class="resize-handle" data-position="w"></div>
        <div class="resize-handle" data-position="e"></div>
        <div class="resize-handle" data-position="sw"></div>
        <div class="resize-handle" data-position="s"></div>
        <div class="resize-handle" data-position="se"></div>
    </div>

    <div id="overlay-toolbar" class="overlay-toolbar" role="group" aria-label="Translation controls" data-i18n-aria-label="overlay.controls" hidden>
        <div class="overlay-toolbar-actions">
            <button id="settings-button" class="overlay-tool-button" type="button" title="Subtitle style" data-i18n-title="overlay.style" aria-label="Subtitle style" data-i18n-aria-label="overlay.style" aria-expanded="false" aria-controls="settings-menu" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <span class="overlay-toolbar-divider" aria-hidden="true"></span>
            <button id="exit-translation-button" class="overlay-tool-button overlay-exit-button" type="button" title="Exit translation and return to Home" data-i18n-title="overlay.exitHome" aria-label="Exit translation" data-i18n-aria-label="overlay.exit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m16 17 5-5-5-5M21 12H9M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/>
                </svg>
            </button>
        </div>
        <p id="overlay-toolbar-error" class="overlay-toolbar-error" role="alert" hidden></p>
    </div>

    <!-- Subtitle display area -->
    <div id="subtitle-container" class="subtitle-container hidden">
        <div id="subtitle-text" class="subtitle-text"></div>
    </div>

    <div id="overlay-session-status" class="overlay-session-status" role="status" aria-live="polite" hidden>
        <span id="overlay-session-status-text"></span>
        <button id="overlay-session-status-action" type="button" hidden data-i18n="overlay.home">Exit to Home</button>
    </div>

    <!-- Quick subtitle style popup -->
    <div id="settings-menu" class="settings-menu hidden" role="dialog" aria-label="Subtitle style" data-i18n-aria-label="overlay.style">
        <div class="settings-menu-title">
            <span data-i18n="overlay.style">Subtitle style</span>
            <button id="settings-close" class="settings-close" type="button" aria-label="Close subtitle style" data-i18n-aria-label="overlay.closeStyle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="settings-item">
            <div class="settings-label-row">
                <label for="font-size-slider" data-i18n="overlay.textSize">Text size</label>
                <span id="font-size-display" class="settings-value"></span>
            </div>
            <input type="range" id="font-size-slider" class="slider" step="1">
        </div>
        <div class="settings-item">
            <span id="plate-label" class="settings-label" data-i18n="overlay.background">Background</span>
            <div class="plate-choice" role="radiogroup" aria-labelledby="plate-label">
                <label><input type="radio" name="subtitle-plate" value="dark"><span data-i18n="overlay.dark">Dark</span></label>
                <label><input type="radio" name="subtitle-plate" value="light"><span data-i18n="overlay.light">Light</span></label>
            </div>
        </div>
    </div>

    <!-- Diagnostics panel (bottom-right, turned on from Developer options) -->
    <div id="debug-info" class="debug-info hidden">
        <span data-i18n="overlay.loaded">OVERLAY LOADED</span>
        <span id="debug-region" data-i18n="overlay.regionWaiting">Region: waiting...</span>
        <span id="debug-status" data-i18n="overlay.initializing">Status: initializing...</span>
    </div>

    <script type="module" src="./entries/overlay.ts"></script>
</body>
</html>
