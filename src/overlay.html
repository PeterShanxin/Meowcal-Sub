<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/controls.css">
    <link rel="stylesheet" href="styles/overlay.css">
    <link rel="stylesheet" href="styles/overlay-settings.css">
    <link rel="stylesheet" href="styles/overlay-theme.css">
</head>
<body>
    <!--
        This overlay window is fullscreen and transparent.
        It displays:
        1. A frame around the capture region
        2. Translated subtitles near the capture region
    -->

    <!-- Capture region frame -->
    <div id="capture-frame" class="capture-frame hidden">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <!-- 8 Resize handles (appear on hover) -->
        <div class="resize-handle" data-position="nw"></div>
        <div class="resize-handle" data-position="n"></div>
        <div class="resize-handle" data-position="ne"></div>
        <div class="resize-handle" data-position="w"></div>
        <div class="resize-handle" data-position="e"></div>
        <div class="resize-handle" data-position="sw"></div>
        <div class="resize-handle" data-position="s"></div>
        <div class="resize-handle" data-position="se"></div>

        <!-- Settings gear button (top-right corner of capture frame) -->
        <button id="settings-button" class="settings-button" type="button" title="Subtitle style" aria-label="Subtitle style">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- Subtitle display area -->
    <div id="subtitle-container" class="subtitle-container hidden">
        <!-- Lightweight status / fallback hint (shown only when useful) -->
        <div id="subtitle-hint" class="subtitle-hint" aria-live="polite">
            <span class="hint-dot" aria-hidden="true"></span>
            <span id="subtitle-hint-text"></span>
        </div>
        <div id="subtitle-text" class="subtitle-text"></div>
    </div>

    <!-- Quick subtitle style popup -->
    <div id="settings-menu" class="settings-menu hidden" role="dialog" aria-label="Subtitle style">
        <div class="settings-menu-title">
            <span>Subtitle style</span>
            <button id="settings-close" class="settings-close" type="button" aria-label="Close subtitle style">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="settings-item">
            <div class="settings-label-row">
                <label for="font-size-slider">Text size</label>
                <span id="font-size-display" class="settings-value"></span>
            </div>
            <input type="range" id="font-size-slider" class="slider" step="1">
        </div>
        <div class="settings-item">
            <span id="plate-label" class="settings-label">Background</span>
            <div class="plate-choice" role="radiogroup" aria-labelledby="plate-label">
                <label><input type="radio" name="subtitle-plate" value="dark"><span>Dark</span></label>
                <label><input type="radio" name="subtitle-plate" value="light"><span>Light</span></label>
            </div>
        </div>
    </div>

    <!-- Diagnostics panel (bottom-right, turned on from Developer options) -->
    <div id="debug-info" class="debug-info hidden">
        <span>OVERLAY LOADED</span>
        <span id="debug-region">Region: waiting...</span>
        <span id="debug-status">Status: initializing...</span>
    </div>

    <script type="module" src="./entries/overlay.ts"></script>
</body>
</html>
