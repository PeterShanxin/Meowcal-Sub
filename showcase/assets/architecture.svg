<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Meowcal Sub pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .box { fill:#1e293b; stroke:#38bdf8; stroke-width:2; rx:10; }
      .arrow { stroke:#94a3b8; stroke-width:2; fill:none; marker-end:url(#head); }
      .label { fill:#e2e8f0; font: 600 13px 'Segoe UI', system-ui, sans-serif; }
      .sub { fill:#94a3b8; font: 12px 'Segoe UI', system-ui, sans-serif; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="820" height="220" fill="url(#bg)" rx="12"/>
  <text x="24" y="34" class="label" font-size="16">Meowcal Sub — high-level pipeline</text>
  <g transform="translate(24 58)">
    <rect class="box" width="108" height="56"/><text x="54" y="24" text-anchor="middle" class="label">Capture</text><text x="54" y="42" text-anchor="middle" class="sub">screen region</text>
    <line class="arrow" x1="108" y1="28" x2="132" y2="28"/>
    <g transform="translate(132 0)"><rect class="box" width="108" height="56"/><text x="54" y="24" text-anchor="middle" class="label">Preprocess</text><text x="54" y="42" text-anchor="middle" class="sub">OCR prep</text></g>
    <line class="arrow" x1="240" y1="28" x2="264" y2="28"/>
    <g transform="translate(264 0)"><rect class="box" width="108" height="56"/><text x="54" y="24" text-anchor="middle" class="label">Windows OCR</text><text x="54" y="42" text-anchor="middle" class="sub">on-device</text></g>
    <line class="arrow" x1="372" y1="28" x2="396" y2="28"/>
    <g transform="translate(396 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">Normalize</text><text x="60" y="42" text-anchor="middle" class="sub">dedupe lines</text></g>
    <line class="arrow" x1="516" y1="28" x2="540" y2="28"/>
    <g transform="translate(540 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">Local HY-MT</text><text x="60" y="42" text-anchor="middle" class="sub">CPU / GPU</text></g>
    <line class="arrow" x1="660" y1="28" x2="684" y2="28"/>
    <g transform="translate(684 0)"><rect class="box" width="108" height="56"/><text x="54" y="24" text-anchor="middle" class="label">Overlay</text><text x="54" y="42" text-anchor="middle" class="sub">floating UI</text></g>
  </g>
  <text x="24" y="190" class="sub">All stages run locally on Windows 11. Subtitle text is not uploaded.</text>
</svg>
