<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" role="img" aria-labelledby="title description">
  <title id="title">From on-screen subtitles to a local translation overlay</title>
  <desc id="description">Workflow diagram, not an application screenshot. Meowcal Sub captures the selected subtitle area, reads it with Windows OCR, translates with local HY-MT, and displays a floating overlay. Subtitle text is not uploaded.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#171d28"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#9fb0c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .step { fill: #121823; stroke: #354155; }
      .label { fill: #f5f7ff; font-size: 20px; font-weight: 600; }
      .detail { fill: #c0c9dc; font-size: 16px; }
      .number { fill: #9fb0c8; font-size: 13px; letter-spacing: 2px; }
      .connector { stroke: #9fb0c8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="270" rx="20" fill="url(#background)" stroke="#293241"/>
  <text x="32" y="41" fill="#c0c9dc" font-size="14" letter-spacing="2">ONE SELECTED AREA. LOCAL PROCESSING.</text>
  <g transform="translate(32 68)">
    <rect class="step" width="200" height="119" rx="14"/>
    <text class="number" x="20" y="28">01</text>
    <text class="label" x="20" y="59">Select subtitles</text>
    <text class="detail" x="20" y="89">The original screen text</text>
  </g>
  <path class="connector" d="M239 128H253"/>
  <g transform="translate(264 68)">
    <rect class="step" width="200" height="119" rx="14"/>
    <text class="number" x="20" y="28">02</text>
    <text class="label" x="20" y="59">Read the text</text>
    <text class="detail" x="20" y="89">Windows OCR</text>
  </g>
  <path class="connector" d="M471 128H485"/>
  <g transform="translate(496 68)">
    <rect class="step" width="200" height="119" rx="14"/>
    <text class="number" x="20" y="28">03</text>
    <text class="label" x="20" y="59">Translate locally</text>
    <text class="detail" x="20" y="89">Tencent HY-MT</text>
  </g>
  <path class="connector" d="M703 128H717"/>
  <g transform="translate(728 68)">
    <rect class="step" width="200" height="119" rx="14"/>
    <text class="number" x="20" y="28">04</text>
    <text class="label" x="20" y="59">Keep watching</text>
    <text class="detail" x="20" y="89">A floating translation</text>
  </g>
  <text x="32" y="236" fill="#c0c9dc" font-size="16">No subtitle uploads. No audio transcription.</text>
  <text x="928" y="236" fill="#9fb0c8" font-size="16" text-anchor="end">Meowcal Sub</text>
</svg>
