name: Bug report
description: Something the application does is wrong.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy first.** Meowcal Sub reads text off your screen. Never paste
        captured subtitle text, screenshots of what you were watching, or raw
        logs that contain them. Timings, error codes, engine state, and file
        paths are the parts that help; redact the rest.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The installed application version, or the commit SHA you built.
      placeholder: 0.6.9
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows build and architecture
      description: Run `winver` for the build. ARM64 and x64 behave differently here.
      placeholder: Windows 11 26200, ARM64
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      options:
        - Screen capture or region selection
        - Windows OCR
        - Translation or engine
        - Subtitle overlay
        - Main window or setup
        - Tray, startup, or shutdown
        - Installer or update
        - Somewhere else / not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Say if it only happens sometimes.
      placeholder: |
        1. Start translation on a 4K display at 150% scaling
        2. Select a region across the bottom third
        3. ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, timings, or screenshots
      description: >-
        Optional. Redact screen content first. A screenshot of the overlay's own
        chrome is fine; a screenshot of what you were watching is not.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report contains no captured subtitle text or private screen content.
          required: true
