name: Publish Meowcal Core Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Core semantic version without a prefix, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Core release contract
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate branch and Core version
        id: version
        shell: pwsh
        env:
          CORE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') {
            throw "Core releases must be published from main, not $env:RELEASE_REF."
          }
          if ($env:CORE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Core version must use major.minor.patch without a prefix.'
          }
          $manifest = Get-Content -LiteralPath core/Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?ms)^\[package\].*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"')
          if (-not $match.Success -or $match.Groups['version'].Value -ne $env:CORE_VERSION) {
            throw "core/Cargo.toml does not declare version $env:CORE_VERSION."
          }
          "version=$env:CORE_VERSION" >> $env:GITHUB_OUTPUT

      - name: Reserve immutable Core tag
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
          CORE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "core-v$env:CORE_VERSION"

          function Test-ReservedTag {
            git fetch --force origin "refs/tags/${tag}:refs/tags/$tag" *> $null
            if ($LASTEXITCODE -ne 0) { return $false }
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $env:RELEASE_SHA) {
              throw "Tag $tag already points to $tagSha, not $env:RELEASE_SHA."
            }
            return $true
          }

          if (Test-ReservedTag) {
            Write-Host "Tag $tag already reserves this Core release commit."
            exit 0
          }
          git tag --delete $tag *> $null
          git tag $tag $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create local tag $tag." }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            if (Test-ReservedTag) { exit 0 }
            throw "Failed to reserve tag $tag."
          }

  package-x64:
    name: Package Core x64
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/core-package.yml
    with:
      architecture: x64
    permissions:
      contents: read

  package-arm64:
    name: Package Core ARM64
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/core-package.yml
    with:
      architecture: arm64
    permissions:
      contents: read

  release:
    name: Publish Core release
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs:
      - validate
      - package-x64
      - package-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Core packages
        uses: actions/download-artifact@v8
        with:
          path: core-release-assets
          merge-multiple: true

      - name: Verify Core release assets
        shell: pwsh
        run: >-
          ./scripts/verify-core-release-assets.ps1
          -Directory core-release-assets
          -Version $env:CORE_VERSION

      - name: Publish Core GitHub release
        shell: pwsh
        run: |
          $tag = "core-v$env:CORE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Core release $tag already exists; refusing to overwrite it."
          }
          $assets = @(Get-ChildItem core-release-assets -File | ForEach-Object FullName)
          $notes = "Standalone Meowcal Core v$env:CORE_VERSION for Windows x64 and ARM64. Verify each ZIP against its published .sha256 file."
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Meowcal Core v$env:CORE_VERSION" `
            --notes $notes `
            --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish Core release $tag."
          }
