name: Windows Packages

# Packaging runs on GitHub-hosted Windows, native to each shipped architecture:
# windows-2025 emits x64, windows-11-arm emits ARM64. Neither depends on a
# machine the maintainer has to keep online, so a release never queues behind a
# physical host.
#
# Host trust is PeterShanxin and ianmeowmeow, not write access in general.
# Forks, Dependabot, and any other login must not run this job: it holds
# TAURI_SIGNING_PRIVATE_KEY. GitHub evaluates `if:` before dispatch. The actor
# allowlist covers workflow_dispatch and workflow_call (the caller of a reusable
# workflow is the actor who triggered the parent). A fail-closed step repeats
# the allowlist before checkout.
#
# See docs/RELEASE_PACKAGING.md.

on:
  workflow_dispatch:
    inputs:
      arm64_build_jobs:
        description: Hosted ARM64 Cargo jobs
        default: '4'
        type: choice
        options: ['1', '2', '4']
      use_rust_cache:
        description: Use Rust dependency cache (requires shared cache budget)
        default: false
        type: boolean
      architecture:
        description: Windows architecture to package
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
  workflow_call:
    inputs:
      arm64_build_jobs:
        description: Hosted ARM64 Cargo jobs
        default: '4'
        type: string
      use_rust_cache:
        description: Use Rust dependency cache (requires shared cache budget)
        default: false
        type: boolean
      architecture:
        description: Windows architecture to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ inputs.architecture || 'x64' }} MSI and NSIS bundles
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    # Each architecture builds on its own hardware, so no step depends on
    # Windows x64 emulation or on an MSVC cross-linker. An unrecognized
    # architecture lands on the x64 image and is then rejected by "Resolve
    # package contract" below, before any toolchain work.
    #
    # The continuation lines sit at the same column on purpose, so YAML folds
    # this to a single line before the expression parser sees it.
    runs-on: >-
      ${{ inputs.architecture == 'arm64'
      && 'windows-11-arm'
      || 'windows-2025' }}
    timeout-minutes: 180
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
      - name: Require the update signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Checked before the long build rather than after it. An empty value
          # here means a caller invoked this reusable workflow without
          # `secrets: inherit`, which reads as a signing failure at the very end
          # of packaging and says nothing about the cause.
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is empty. A reusable workflow inherits no secrets unless its caller passes 'secrets: inherit'."
          }

      - name: Resolve package contract
        id: package
        shell: pwsh
        env:
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $architecture = $env:REQUESTED_ARCHITECTURE
          if ([string]::IsNullOrWhiteSpace($architecture)) {
            $architecture = "x64"
          }

          $targets = @{
            x64 = "x86_64-pc-windows-msvc"
            arm64 = "aarch64-pc-windows-msvc"
          }
          if (-not $targets.ContainsKey($architecture)) {
            throw "Unsupported package architecture: $architecture"
          }

          # The runner image must match the architecture being packaged. A
          # native build is the whole reason there are two images, and silently
          # emitting an emulated or cross-linked bundle would still upload.
          $expectedOsArchitecture = if ($architecture -eq "arm64") { "Arm64" } else { "X64" }
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($actual -ne $expectedOsArchitecture) {
            throw "Architecture '$architecture' expects a $expectedOsArchitecture runner but this host is $actual."
          }

          "architecture=$architecture" >> $env:GITHUB_OUTPUT
          "target=$($targets[$architecture])" >> $env:GITHUB_OUTPUT
          "artifact=meowcal-sub-$architecture-packages" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          # OverlayHost targets net9.0-windows10.0.22621.0.
          dotnet-version: 9.0.x

      - uses: ./.github/actions/windows-package-build
        with:
          target: ${{ steps.package.outputs.target }}
          target-directory: package-output
          variant: direct
          arm64-build-jobs: ${{ inputs.arm64_build_jobs }}
          use-rust-cache: ${{ inputs.use_rust_cache }}

      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Verify synchronized product version
        shell: pwsh
        run: npm run version:check

      - name: Build Windows packages
        shell: pwsh
        env:
          PACKAGE_ARCHITECTURE: ${{ steps.package.outputs.architecture }}
          # Signs the installers for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          .\scripts\build-package.ps1
          -Architecture $env:PACKAGE_ARCHITECTURE
          -CargoTargetDir "$env:GITHUB_WORKSPACE\package-output"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: package-output/${{ steps.package.outputs.target }}/release/bundle/*/*
          if-no-files-found: error

      - name: Preserve package build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-build-report-${{ steps.package.outputs.architecture }}
          path: package-output/package-build.json
          if-no-files-found: ignore
