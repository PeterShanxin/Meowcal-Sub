name: Windows Packages

# Packaging runs on the owner's self-hosted Windows runners. The architecture
# input selects a custom label, never a GitHub-hosted runner, so there is no
# expression here that can fall back to paid Windows minutes. If the matching
# runner is offline the job queues; that is deliberate. Returning to hosted
# runners is a reviewed revert, not an automatic failover.
#
# See docs/SELF_HOSTED_RUNNERS.md.

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Windows architecture to package
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
  workflow_call:
    inputs:
      architecture:
        description: Windows architecture to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ inputs.architecture || 'x64' }} MSI and NSIS bundles
    # One host may carry both package labels, or they may be split onto
    # architecture-native hosts later; that is a runner registration decision and
    # needs no change here. An unrecognized architecture lands on the x64 label
    # and is then rejected by "Resolve package contract" below.
    #
    # The continuation lines sit at the same column on purpose, so YAML folds
    # this to a single line before the expression parser sees it.
    runs-on: >-
      ${{ inputs.architecture == 'arm64'
      && fromJSON('["self-hosted", "Windows", "meowcal-package-arm64"]')
      || fromJSON('["self-hosted", "Windows", "meowcal-package-x64"]') }}
    steps:
      - name: Require the update signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Checked before the twenty-minute build rather than after it. An
          # empty value here means a caller invoked this reusable workflow
          # without `secrets: inherit`, which reads as a signing failure at the
          # very end of packaging and says nothing about the cause.
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is empty. A reusable workflow inherits no secrets unless its caller passes 'secrets: inherit'."
          }

      - name: Resolve package contract
        id: package
        shell: pwsh
        env:
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $architecture = $env:REQUESTED_ARCHITECTURE
          if ([string]::IsNullOrWhiteSpace($architecture)) {
            $architecture = "x64"
          }

          $targets = @{
            x64 = "x86_64-pc-windows-msvc"
            arm64 = "aarch64-pc-windows-msvc"
          }
          if (-not $targets.ContainsKey($architecture)) {
            throw "Unsupported package architecture: $architecture"
          }

          "architecture=$architecture" >> $env:GITHUB_OUTPUT
          "target=$($targets[$architecture])" >> $env:GITHUB_OUTPUT
          "artifact=meowcal-sub-$architecture-packages" >> $env:GITHUB_OUTPUT

      # A clean checkout on purpose, unlike CI. `git clean -ffdx` removes the
      # previous run's target directory and bundle output, so a release build
      # never reuses incremental artifacts or inherits a stale bundle. The extra
      # cold-build minutes are local compute and cost nothing.
      - uses: actions/checkout@v4

      # Node, Rust, both Windows target triples, and the MSVC cross-linker are
      # host properties installed and checked by
      # scripts/setup-self-hosted-runner.ps1. Packaging deliberately does not
      # restore a dependency cache: a release build starts cold.
      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Verify synchronized product version
        shell: pwsh
        run: npm run version:check

      - name: Build Windows packages
        shell: pwsh
        env:
          PACKAGE_ARCHITECTURE: ${{ steps.package.outputs.architecture }}
          # Signs the installers for the in-app updater. Absent on forks, where
          # the build still produces installers, just no `.sig` beside them -
          # the release workflow is what refuses to publish that.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          .\scripts\build-package.ps1
          -Architecture $env:PACKAGE_ARCHITECTURE
          -CargoTargetDir "$env:GITHUB_WORKSPACE\package-output"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: package-output/${{ steps.package.outputs.target }}/release/bundle/*/*
          if-no-files-found: error
