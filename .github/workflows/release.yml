name: Prepare Draft Release

# Host trust is PeterShanxin and ianmeowmeow. workflow_dispatch from any other
# login must not reserve tags, call the packager, or create a draft release.
# Every job requires that actor allowlist. The package jobs call package.yml,
# which repeats the check before it touches the signing key.
#
# release-preflight.yml runs everything below except the tag reservation and the
# release creation, so the packaging and asset contract can be exercised without
# spending a version number.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.6.0
        required: true
        type: string

permissions:
  contents: read

# Two runs of the same version would race for the release tag. Queue them instead
# of cancelling: a half-finished release run has already reserved a tag, and
# cancelling it leaves that reservation behind with nothing attached to it.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    # Linux on purpose. This job needs no Windows toolchain, runs in about a
    # minute, and is the only job besides draft-release that holds
    # `contents: write`.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate branch and synchronized version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -ne "refs/heads/main") {
            throw "Draft releases must be prepared from main, not $env:RELEASE_REF."
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use major.minor.patch without a v prefix."
          }

          node scripts/check-version-sync.mjs --expected $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Product version does not match the requested release."
          }
          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT

      - name: Reserve immutable release tag
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          function Test-ReservedTag {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag" *> $null
            if ($LASTEXITCODE -ne 0) {
              return $false
            }

            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $env:RELEASE_SHA) {
              throw "Tag $tag already points to $tagSha, not $env:RELEASE_SHA."
            }
            return $true
          }

          if (Test-ReservedTag) {
            Write-Host "Tag $tag already reserves this release commit."
            exit 0
          }

          git tag --delete $tag *> $null
          git tag $tag $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create local tag $tag."
          }

          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            if (Test-ReservedTag) {
              Write-Host "Another run reserved $tag for this release commit."
              exit 0
            }
            throw "Failed to reserve tag $tag."
          }

  package-x64:
    name: Package x64
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      architecture: x64
    # Without this the called workflow sees empty signing secrets and builds
    # unsignable installers. A reusable workflow inherits nothing by default.
    secrets: inherit
    permissions:
      contents: read

  package-arm64:
    name: Package ARM64
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      architecture: arm64
    secrets: inherit
    permissions:
      contents: read

  draft-release:
    name: Create draft release
    if: >-
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    needs:
      - validate
      - package-x64
      - package-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify assets and write checksums
        shell: pwsh
        run: >-
          ./scripts/verify-release-assets.ps1
          -Directory release-assets
          -ChecksumPath release-assets/SHA256SUMS.txt

      - name: Build the updater manifest
        shell: pwsh
        run: |
          # The public canonical repository owns both the release assets and
          # the updater manifest. The separate legacy bridge copies only this
          # manifest for clients shipped with the former endpoint.
          node scripts/build-updater-manifest.mjs `
            --directory release-assets `
            --version $env:RELEASE_VERSION `
            --tag "v$env:RELEASE_VERSION" `
            --repo $env:GITHUB_REPOSITORY `
            --notes-file "docs/releases/v$env:RELEASE_VERSION.md" `
            --output release-assets/latest.json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build latest.json for v$env:RELEASE_VERSION."
          }

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite it."
          }

          $notesPath = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }

          # The `.sig` files stay behind on purpose. The updater reads the
          # signature text out of latest.json and never fetches a separate file,
          # and publishing them would put two sources of the same truth in front
          # of users.
          $assets = @(Get-ChildItem release-assets -Recurse -File |
            Where-Object {
              $_.Extension -eq ".msi" -or
              $_.Name -like "*-setup.exe" -or
              $_.Name -eq "SHA256SUMS.txt" -or
              $_.Name -eq "latest.json"
            } |
            ForEach-Object FullName)

          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Meowcal Sub $tag" `
            --notes-file $notesPath `
            --draft `
            --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create draft release $tag."
          }
