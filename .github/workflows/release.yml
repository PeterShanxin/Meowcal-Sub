name: Prepare Draft Release

# Write access is not host trust. workflow_dispatch from a collaborator must
# not reserve tags, call the self-hosted packager, or create a draft release.
# Every job requires github.actor == 'PeterShanxin'. The package jobs call
# package.yml, which repeats that check on the self-hosted host.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.6.0
        required: true
        type: string

permissions:
  contents: read

# Two runs of the same version would race for the release tag. Queue them instead
# of cancelling: a half-finished release run has already reserved a tag, and
# cancelling it leaves that reservation behind with nothing attached to it.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    if: >-
      github.actor == 'PeterShanxin' &&
      github.actor != 'dependabot[bot]'
    # Stays GitHub-hosted on purpose. This job is Linux, bills at 1x, runs in
    # about a minute, and holds `contents: write` to reserve the release tag.
    # Moving it to the self-hosted host would save nothing measurable and would
    # put release-write permission on a long-lived machine that also executes
    # contributor pull request code. See docs/SELF_HOSTED_RUNNERS.md.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate branch and synchronized version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -ne "refs/heads/main") {
            throw "Draft releases must be prepared from main, not $env:RELEASE_REF."
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use major.minor.patch without a v prefix."
          }

          node scripts/check-version-sync.mjs --expected $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Product version does not match the requested release."
          }
          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT

      - name: Reserve immutable release tag
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          function Test-ReservedTag {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag" *> $null
            if ($LASTEXITCODE -ne 0) {
              return $false
            }

            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $env:RELEASE_SHA) {
              throw "Tag $tag already points to $tagSha, not $env:RELEASE_SHA."
            }
            return $true
          }

          if (Test-ReservedTag) {
            Write-Host "Tag $tag already reserves this release commit."
            exit 0
          }

          git tag --delete $tag *> $null
          git tag $tag $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create local tag $tag."
          }

          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            if (Test-ReservedTag) {
              Write-Host "Another run reserved $tag for this release commit."
              exit 0
            }
            throw "Failed to reserve tag $tag."
          }

  package-x64:
    name: Package x64
    if: >-
      github.actor == 'PeterShanxin' &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      architecture: x64
    # Without this the called workflow sees empty signing secrets and builds
    # unsignable installers. A reusable workflow inherits nothing by default.
    secrets: inherit
    permissions:
      contents: read

  package-arm64:
    name: Package ARM64
    if: >-
      github.actor == 'PeterShanxin' &&
      github.actor != 'dependabot[bot]'
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      architecture: arm64
    secrets: inherit
    permissions:
      contents: read

  draft-release:
    name: Create draft release
    if: >-
      github.actor == 'PeterShanxin' &&
      github.actor != 'dependabot[bot]'
    needs:
      - validate
      - package-x64
      - package-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      # This repository is private, so its release assets are not downloadable
      # without a token and cannot serve the updater. The manifest therefore
      # points at the public mirror, which `publish-update.yml` fills.
      UPDATE_MIRROR_REPO: PeterShanxin/Meowcal-Sub-releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify assets and write checksums
        shell: pwsh
        run: |
          # Named per architecture rather than counted, so a run that produced
          # four x64 files cannot pass as one that produced both architectures.
          # The signature is checked here too: without it the updater manifest
          # cannot be built, and that failure belongs before the release exists.
          $files = @(Get-ChildItem release-assets -Recurse -File)
          $required = @(
            @{ Kind = "MSI"; Pattern = "*.msi" },
            @{ Kind = "NSIS setup"; Pattern = "*-setup.exe" },
            @{ Kind = "updater signature"; Pattern = "*-setup.exe.sig" }
          )
          foreach ($architecture in @("x64", "arm64")) {
            foreach ($expected in $required) {
              $found = @($files | Where-Object {
                $_.Name -like "*$architecture*" -and $_.Name -like $expected.Pattern
              })
              if ($found.Count -ne 1) {
                throw "Expected exactly one $architecture $($expected.Kind), found $($found.Count)."
              }
            }
          }

          $installers = @($files |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name -like "*-setup.exe" })
          $checksumLines = $installers |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              # GitHub rewrites spaces in release asset names to periods. Keep
              # the checksum manifest aligned with the names users download.
              $downloadName = $_.Name -replace '[^A-Za-z0-9._-]', '.'
              "$hash  $downloadName"
            }
          Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Value $checksumLines -Encoding utf8NoBOM

      - name: Build the updater manifest
        shell: pwsh
        run: |
          # The URLs name the mirror's copy of this tag's assets, which exist
          # only once `publish-update.yml` has run. Publishing there is what
          # turns the update on for every installed copy.
          node scripts/build-updater-manifest.mjs `
            --directory release-assets `
            --version $env:RELEASE_VERSION `
            --tag "v$env:RELEASE_VERSION" `
            --repo $env:UPDATE_MIRROR_REPO `
            --notes-file "docs/releases/v$env:RELEASE_VERSION.md" `
            --output release-assets/latest.json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build latest.json for v$env:RELEASE_VERSION."
          }

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite it."
          }

          $notesPath = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }

          # The `.sig` files stay behind on purpose. The updater reads the
          # signature text out of latest.json and never fetches a separate file,
          # and publishing them would put two sources of the same truth in front
          # of users.
          $assets = @(Get-ChildItem release-assets -Recurse -File |
            Where-Object {
              $_.Extension -eq ".msi" -or
              $_.Name -like "*-setup.exe" -or
              $_.Name -eq "SHA256SUMS.txt" -or
              $_.Name -eq "latest.json"
            } |
            ForEach-Object FullName)

          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Meowcal Sub $tag" `
            --notes-file $notesPath `
            --draft `
            --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create draft release $tag."
          }
