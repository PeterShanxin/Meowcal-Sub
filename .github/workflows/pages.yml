# Builds the product site and publishes it to GitHub Pages.
#
# scripts/site/build.mjs generates static HTML from the copy in scripts/site/
# and the screenshots in docs/assets/. The Sub 1 version and installer links
# come from README.md, so the README update of a release redeploys the site.
#
# A pull request builds the site and stops. Only a push to main, or a manual run
# on main, publishes; Pages write access exists on that one job.
#
# See site/README.md.

name: Product site

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - site/**
      - scripts/site/**
      - docs/assets/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - README.md
      - site/**
      - scripts/site/**
      - docs/assets/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A publish in progress finishes; a superseded pull request build does not.
concurrency:
  group: product-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build product site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/site/build.mjs --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish product site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
