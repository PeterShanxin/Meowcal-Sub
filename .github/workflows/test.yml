# CI pipeline for Meowcal-Sub.
#
# Stage 2 public PR gate: GitHub-hosted Windows runs verify.ps1 on every
# pull_request and every push to main. windows-11-arm executes native ARM64;
# windows-2025 executes native x64. One architecture is not evidence for the
# other. These jobs install their own toolchain, use contents: read, leave
# persist-credentials false, and never see TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, or RELEASE_MIRROR_TOKEN.
#
# Self-hosted meowcal-ci is not a PR gate. It stays on the owner's Snapdragon /
# Adreno host for real-hardware evidence that PeterShanxin or ianmeowmeow
# dispatch. GitHub evaluates that job-level `if:` before dispatch, so a
# pull_request never queues on meowcal-ci. Host trust is those two logins, not
# write access in general. A fail-closed step repeats the allowlist before
# checkout so a bypassed `if:` still refuses the job.
#
# Packaging and signing stay in package.yml / release.yml: self-hosted,
# trusted-admin dispatch, holding the updater key. Hosted PR CI is not a
# failover for those jobs. windows-latest remains forbidden; it is the silent
# alias this policy exists to prevent.
#
# See docs/SELF_HOSTED_RUNNERS.md for the host contract and the security model.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pull request runs are cancelled. Hosted jobs from different
# events do not share a group with a hardware dispatch on the same ref, so a
# maintainer dispatch cannot queue behind — or cancel — public PR evidence.
# `main` pushes are deliberately excluded from cancellation, because cancelling
# a post-merge run leaves the branch every other branch is cut from unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # ARM64 execute host for the public gate. The crate compiles different code
    # per architecture — see the cfg(target_arch) split in
    # src-tauri/src/engine_launch.rs — so this job is native aarch64 evidence,
    # not x64 evidence.
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      - name: Lint the native ARM64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Lint -Target aarch64-pc-windows-msvc

  test:
    name: Tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      - name: Test the native ARM64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Test -Target aarch64-pc-windows-msvc

  frontend:
    name: Frontend & Browser
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      # Architecture-independent for the frontend graph; the browser smoke
      # still drives host-native Rust, so this is ARM64 backend evidence.
      - name: Run frontend and browser verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Frontend

  verify-x64:
    name: Windows x64
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Native x64 execute host. Do not read the ARM64 jobs as covering this.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Verify the native x64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Target x86_64-pc-windows-msvc

  hardware-lint:
    name: Hardware Lint & Format
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    # ARM64 here is load-bearing rather than descriptive. Windows x64 emulation
    # runs one way only, so only an ARM64 host can build *and execute* both
    # shipped architectures. The crate compiles different code for each - see the
    # cfg(target_arch) split in src-tauri/src/engine_launch.rs - and
    # docs/AGENT_GUIDE.md forbids treating one architecture's evidence as the
    # other's.
    runs-on: [self-hosted, Windows, ARM64, meowcal-ci]
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $author = [string]$event.pull_request.user.login
            $head = [string]$event.pull_request.head.repo.full_name
            if ($trusted -notcontains $author) {
              throw "Privileged job refused PR author '$author'."
            }
            if ($head -ne $env:GITHUB_REPOSITORY) {
              throw "Privileged job refused fork head '$head'."
            }
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          # The runner workspace persists between runs. A clean checkout runs
          # `git clean -ffdx`, which would delete src-tauri/target and
          # node_modules and force a cold Rust rebuild every single run. Tracked
          # files are still force-checked-out, so only ignored build output
          # survives. Packaging keeps the default clean checkout, where
          # reproducibility outranks speed. `clean: false` is acceptable only
          # because this job never runs fork, untrusted, or Dependabot code.
          clean: false

      # The toolchain is a property of the host, installed and verified by
      # scripts/setup-self-hosted-runner.ps1, not something CI installs per run.
      # A self-hosted runner that rewrites its own global Rust and Node
      # installation on every job is a machine nobody can reason about.
      - name: Lint the native ARM64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Lint -Target aarch64-pc-windows-msvc

      - name: Lint the x64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Lint -Target x86_64-pc-windows-msvc

  hardware-test:
    name: Hardware Tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Windows, ARM64, meowcal-ci]
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $author = [string]$event.pull_request.user.login
            $head = [string]$event.pull_request.head.repo.full_name
            if ($trusted -notcontains $author) {
              throw "Privileged job refused PR author '$author'."
            }
            if ($head -ne $env:GITHUB_REPOSITORY) {
              throw "Privileged job refused fork head '$head'."
            }
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          clean: false

      - name: Test the native ARM64 target
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Test -Target aarch64-pc-windows-msvc

      # Executed, not merely compiled: the ARM64 host runs x64 binaries under
      # emulation, so this is native-hardware x64 evidence, not hosted x64.
      - name: Test the x64 target under emulation
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Test -Target x86_64-pc-windows-msvc

  hardware-frontend:
    name: Hardware Frontend & Browser
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Windows, ARM64, meowcal-ci]
    steps:
      - name: Require a trusted actor
        shell: pwsh
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($trusted -notcontains $env:GITHUB_ACTOR) {
            throw "Privileged job refused actor '$($env:GITHUB_ACTOR)'."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $author = [string]$event.pull_request.user.login
            $head = [string]$event.pull_request.head.repo.full_name
            if ($trusted -notcontains $author) {
              throw "Privileged job refused PR author '$author'."
            }
            if ($head -ne $env:GITHUB_REPOSITORY) {
              throw "Privileged job refused fork head '$head'."
            }
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          clean: false

      # Architecture-independent by nature: this stage checks the frontend and
      # drives browser mode against the host-native Rust backend. The browser
      # smoke uses the system Google Chrome channel, which the runner host
      # provides.
      - name: Run frontend and browser verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Frontend
