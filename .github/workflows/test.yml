# CI pipeline for Meowcal-Sub
# Runs on every PR to main and pushes to main.
# All jobs use windows-latest because the project depends on Windows APIs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run lint verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Lint

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run test verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Test

  frontend:
    name: Frontend & Browser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run frontend and browser verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Stage Frontend
