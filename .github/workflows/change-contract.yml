# Enforces docs/CHANGE_CONTRACT.md on the metadata of a pull request: the
# commits it adds and its title.
#
# This job stays on hosted Linux on purpose. It reads Git metadata and runs a
# dependency-free Node script, so it needs neither Windows nor the toolchain,
# and a misnamed commit is reported in seconds without consuming a hosted
# Windows minute or starting the self-hosted hardware runner. Hosted Windows in
# test.yml is the Stage 2 PR gate; this job is not that gate.
#
# It runs only on pull requests, and it reads only the commits the branch adds
# to the current base tip. Nothing already on `main` is validated, which is what
# keeps this contract free of any history rewrite.

name: Change Contract

on:
  pull_request:
    branches: [main]
    # `edited` is load-bearing: the default trigger set does not include it, so
    # correcting a rejected title would leave the failed check standing with no
    # way to re-run it except an empty push. `ready_for_review` re-checks a
    # description that was still a placeholder while the pull request was a
    # draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Change Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range between the base tip and the head must be present.
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects and the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-commit-contract.mjs --base FETCH_HEAD --head "$HEAD_SHA"
