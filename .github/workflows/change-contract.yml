# Enforces docs/CHANGE_CONTRACT.md on the metadata of a pull request: the
# commits it adds and its title.
#
# This is the one job that deliberately does not run on the owner's self-hosted
# Windows runners. It reads Git metadata and runs a dependency-free Node script,
# so it needs neither Windows nor the toolchain - and putting it on Linux means
# a misnamed commit is reported in seconds without anyone starting the single
# self-hosted runner, and without queuing ahead of a real build. The runner
# policy in docs/SELF_HOSTED_RUNNERS.md forbids hosted *Windows* runners; Linux
# stays allowed for exactly this kind of work.
#
# It runs only on pull requests, and it reads only the commits the branch adds
# to the current base tip. Nothing already on `main` is validated, which is what
# keeps this contract free of any history rewrite.

name: Change Contract

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Change Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range between the base tip and the head must be present.
          fetch-depth: 0

      - name: Check commit subjects and the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-commit-contract.mjs --base FETCH_HEAD --head "$HEAD_SHA"
