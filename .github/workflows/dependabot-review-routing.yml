name: Dependabot review routing

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  route-review:
    if: github.event.pull_request != null && github.event.pull_request.user.login != 'PeterShanxin'
    runs-on: ubuntu-latest
    steps:
      - name: Route review request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login || '' }}
          REVIEW_BODY: ${{ github.event.review.body || '' }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          payload='{"reviewers":["PeterShanxin"]}'

          request_review() {
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              -X POST "$api" -d "$payload" >/dev/null
          }

          remove_review() {
            # Removing an absent request is harmless for routing purposes.
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              -X DELETE "$api" -d "$payload" >/dev/null || true
          }

          # Normal human/code PRs keep the existing maintainer-review behavior.
          if [[ "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            if [[ "$EVENT_NAME" == "pull_request_target" && "$EVENT_ACTION" != "synchronize" ]]; then
              request_review
            fi
            exit 0
          fi

          normalized="$(printf '%s %s' "$PR_TITLE" "$PR_HEAD" | tr '[:upper:]' '[:lower:]')"
          low_risk=false
          if [[ "$normalized" == *"minor-patch"* \
             || "$normalized" == *"minor-and-patch"* \
             || "$normalized" == *"compatible-dependencies"* \
             || "$normalized" == *"compatible-actions"* ]]; then
            low_risk=true
          fi

          # A group name reflects Dependabot's semver positions, but Cargo and npm
          # treat a 0.x minor bump (0.41 -> 0.42) as breaking and Dependabot still
          # files it under a minor-patch group. Dependabot also truncates long
          # bodies, so every update the title counts must be listed and compatible.
          compatible_updates_only() {
            local pattern='^Updates `[^`]+` from ([^ ]+) to ([^ ]+)$'
            local semver='^([0-9]+)\.([0-9]+)\.([0-9]+)'
            local expected=1 listed=0 line from to
            if [[ "$PR_TITLE" =~ with\ ([0-9]+)\ updates? ]]; then
              expected="${BASH_REMATCH[1]}"
            fi
            while IFS= read -r line; do
              [[ "$line" =~ $pattern ]] || continue
              listed=$((listed + 1))
              from="${BASH_REMATCH[1]}"
              to="${BASH_REMATCH[2]}"
              [[ "$from" =~ $semver ]] || return 1
              local old=("${BASH_REMATCH[@]:1}")
              [[ "$to" =~ $semver ]] || return 1
              local new=("${BASH_REMATCH[@]:1}")
              [[ "${old[0]}" == "${new[0]}" ]] || return 1
              if [[ "${old[0]}" == 0 ]]; then
                [[ "${old[1]}" == "${new[1]}" ]] || return 1
                if [[ "${old[1]}" == 0 ]]; then
                  [[ "${old[2]}" == "${new[2]}" ]] || return 1
                fi
              fi
            done < <(printf '%s\n' "$PR_BODY" | tr -d '\r')
            [[ "$listed" -eq "$expected" ]]
          }

          if [[ "$low_risk" == true ]] && ! compatible_updates_only; then
            low_risk=false
          fi

          # Dependabot groups are deliberately named so patch/minor updates are
          # recognizable without executing PR code. Ungrouped updates are treated
          # conservatively as manual-review changes (normally majors/breaking bumps).
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ "$low_risk" == true ]]; then
              remove_review
            else
              request_review
            fi
            exit 0
          fi

          # Cursor's approval automation currently submits COMMENTED reviews.
          # A Codex timeout or pending CI is not by itself a reason to notify the
          # maintainer. Real failures/findings remain review-worthy.
          [[ "$REVIEW_AUTHOR" == "cursor" ]] || exit 0

          if [[ "$low_risk" != true ]]; then
            request_review
            exit 0
          fi

          body="$(printf '%s' "$REVIEW_BODY" | tr '[:upper:]' '[:lower:]')"
          clean_dependency_review=false
          if [[ "$body" == *"security agent passed"* \
             && "$body" != *"failed"* \
             && "$body" != *"failing"* \
             && "$body" != *"security finding"* \
             && "$body" != *"security agent found"* \
             && "$body" != *"bugbot found"* \
             && "$body" != *"finding:"* ]]; then
            clean_dependency_review=true
          fi

          # Codex timeout, pending CI, or Cursor's subjective risk label alone is
          # not actionable for a grouped patch/minor update.
          if [[ "$clean_dependency_review" == true ]]; then
            remove_review
          else
            request_review
          fi
