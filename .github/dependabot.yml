version: 2

updates:
  # Frontend / Tauri CLI dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Rust / Tauri backend dependencies.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Core takes every version update, including breaking ones; a group only
  # batches them. A core/Cargo.toml change also needs src-tauri/Cargo.lock
  # (docs/AGENT_GUIDE.md, Verification).
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 10
    ignore:
      # windows-future 0.100 needs windows-core 0.100, which no published
      # windows release uses. Remove once one does (#232).
      - dependency-name: "windows-future"
        versions: [">= 0.100"]
    groups:
      # The OCR completion handler from windows-future must share windows-core
      # with windows, so updating either alone does not compile.
      windows-rs:
        applies-to: "version-updates"
        patterns:
          - "windows"
          - "windows-future"
      core-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # WinUI 3 OverlayHost dependencies.
  - package-ecosystem: "nuget"
    directory: "/src-winui3/OverlayHost"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      nuget-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep pinned third-party GitHub Actions current as workflows evolve.
  # "/" covers .github/workflows only, so composite actions are listed too -
  # the gate's third-party action lives in one of them and is pinned to a
  # commit, which Dependabot bumps in place.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/windows-rust-gate"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
