name: Build and verify a native portable ZIP
description: Package, extract, and launch the portable application on its native Windows runner.
inputs:
  target:
    description: Native Rust target triple.
    required: true
  architecture:
    description: Windows ZIP architecture, x64 or arm64.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
    - uses: ./.github/actions/windows-package-build
      with:
        target: ${{ inputs.target }}
        target-directory: portable-output
        variant: portable
    - uses: ./.github/actions/prepare-reviewed-core
    - name: Package and start native portable ZIP
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE/portable-output"
        if ($env:ARCHITECTURE -eq 'arm64') {
          $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '1'
          $env:CARGO_PROFILE_RELEASE_LTO = 'false'
        }
        npm ci --ignore-scripts
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        ./scripts/fetch-meowcal-core.ps1 -Architecture $env:ARCHITECTURE
        ./scripts/build-overlayhost.ps1 -Architecture $env:ARCHITECTURE
        ./scripts/build-portable.ps1 -TargetTriple $env:TARGET -Architecture $env:ARCHITECTURE -CargoTargetDir $env:CARGO_TARGET_DIR
    - uses: actions/upload-artifact@v7
      with:
        name: portable-${{ inputs.architecture }}-validation
        path: portable-output/${{ inputs.target }}/release/bundle/portable/*-portable.zip
        if-no-files-found: error
