name: Windows Rust gate toolchain
description: >-
  Node, the Rust toolchain for one Windows target, the Cargo dependency cache,
  and the build parallelism the hosted verify gate uses.

inputs:
  target:
    description: The Rust target triple this job verifies.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # One target per job. Each gate job verifies a single architecture, so
    # installing the other one buys nothing and an x64 image cannot use it.
    - name: Install the Rust toolchain and this job's target
      shell: pwsh
      env:
        GATE_TARGET: ${{ inputs.target }}
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup target add $env:GATE_TARGET
        rustup default stable

    # Without this every job compiles the whole dependency tree from source on
    # every run.
    #
    # Only `main` writes an entry, so branches do not fill the repository cache
    # with duplicate per-ref copies. A pull request can still restore the entry
    # written by `main`.
    #
    # What keeps fork and Dependabot code out of the entry `main` restores is
    # separate and unconditional: GitHub scopes a written entry to the ref that
    # wrote it, so a pull request's writes land on its own ref and `main` never
    # reads them.
    #
    # Pinned to a commit rather than a tag: this is the only third-party action
    # here, it runs in a job that executes contributor code, and on `main` it is
    # the step that writes bytes every later job unpacks into the Rust targets.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          src-tauri -> target
          core -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build on every core the runner has
      shell: pwsh
      run: |
        # verify.ps1 serializes rustc whenever an ARM64 host meets a cold target
        # directory, which a CI checkout always is. That default exists for a
        # local Snapdragon machine, and the STATUS_STACK_BUFFER_OVERRUN it
        # guards against does not reproduce on this four-core hosted image -
        # measured in docs/plans/2026-09-10-ci-gate-timing.md. verify.ps1
        # honours an explicit value over its own default.
        Write-Host "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS"
        "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV
