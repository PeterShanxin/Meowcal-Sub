name: Windows Rust gate toolchain
description: >-
  Node, the Rust toolchain for one Windows target, the Cargo dependency cache,
  and the build parallelism the hosted verify gate uses.

inputs:
  target:
    description: The Rust target triple this job verifies.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # One target per job. Each gate job verifies a single architecture, so
    # installing the other one buys nothing and an x64 image cannot use it.
    - name: Install the Rust toolchain and this job's target
      shell: pwsh
      env:
        GATE_TARGET: ${{ inputs.target }}
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup target add $env:GATE_TARGET
        rustup default stable

    # Without this every job compiles the whole dependency tree from source on
    # every run.
    #
    # Only `main` writes an entry. These five jobs hold 3.4 GB between them and
    # a repository gets 10 GB, so branches each writing their own set would
    # evict one another. The key carries no branch, so a pull request restoring
    # `main`'s entry gets the same exact hit it would otherwise have written.
    # It is also what keeps fork and Dependabot code out of the entry `main`
    # restores, because GitHub scopes a written entry to the ref that wrote it.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build on every core the runner has
      shell: pwsh
      run: |
        # verify.ps1 serializes rustc whenever an ARM64 host meets a cold target
        # directory, which a CI checkout always is. That default exists for a
        # local Snapdragon machine; a hosted runner has four cores and 16 GB and
        # does not reproduce the STATUS_STACK_BUFFER_OVERRUN it guards against.
        # verify.ps1 honours an explicit value over its own default.
        Write-Host "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS"
        "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV
