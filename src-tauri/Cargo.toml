# =============================================================================
# MEOWCAL-SUB: Cargo.toml - Rust Dependencies
# =============================================================================
# This file tells Rust what external libraries (called "crates") we need.
# Think of it like package.json for JavaScript or requirements.txt for Python.
# =============================================================================

[package]
# Basic info about our app
name = "meowcal-sub"        # The app name (used in binary and imports)
default-run = "meowcal-sub"
version = "0.6.9"           # Version number (semantic versioning: major.minor.patch)
edition = "2021"            # Rust edition (like ES6 vs ES2020 in JavaScript)
description = "On-device subtitle capture and translation for Windows"
authors = ["PeterShanxin"]
license = "AGPL-3.0-only"

# =============================================================================
# FEATURES
# =============================================================================
# These are optional compile-time switches for advanced capabilities.

[features]
# Enable Windows-specific E2E tests
test-windows = []

# =============================================================================
# DEPENDENCIES
# =============================================================================
# These are the libraries we use. Each one has a purpose:

[dependencies]
# --- Tauri Framework ---
# This is the core of our app - it creates the window and connects Rust to the web UI
tauri = { version = "2", features = [
    "tray-icon",          # System tray support (the icon in the taskbar)
] }
tauri-plugin-opener = "2"  # Opens URLs/files with system defaults
tauri-plugin-dialog = "2"  # Native file/folder picker dialogs
raw-window-handle = "0.6"  # Cross-platform window handle access (for NonRudeHWND)

# In-app update check and apply, plus the restart that follows one.
#
# `default-features = false` drops the plugin's rustls/ring stack: this crate
# graph is deliberately native-TLS only, because ring needs a C toolchain that
# Windows ARM64 builds do not reliably have. `zip` stays because the updater
# decides how to unpack from the artifact it downloaded, not from our config.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "native-tls",
    "zip",
] }
tauri-plugin-process = "2"  # Restart into the freshly installed version

# --- Serialization ---
# Converts Rust structs to/from JSON (for sending data between Rust and JavaScript)
serde = { version = "1", features = ["derive"] }  # "derive" lets us use #[derive(Serialize)]
serde_json = "1"           # JSON parsing and generation

# --- Small Utilities ---
# Used for the selector window screenshot workaround (data:image/png;base64,...)
base64 = "0.22"
png = "0.18"
scopeguard = "1.2"          # RAII guards for panic-safe cleanup

# --- Async Runtime ---
# Rust's way of handling async operations (like JavaScript's async/await)
tokio = { version = "1", features = ["full"] }

# --- HTTP Client ---
# Used for downloading translateLocally binaries from GitHub.
# Use Windows native TLS to avoid rustls/ring toolchain friction on Windows ARM64.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }

# --- Global State ---
# For managing persistent capture session
lazy_static = "1.4"

# --- Windows APIs ---
# This gives us access to Windows-specific features like OCR and screen capture
# The "features" list specifies which Windows APIs we want to use
windows = { version = "0.61", features = [
    # OCR (Optical Character Recognition) - reads text from images
    "Media_Ocr",
    
    # Image handling - creating bitmaps from screen captures
    "Graphics_Imaging",
    
    # Memory streams - for passing image data around
    "Storage_Streams",
    
    # Screen capture APIs (GDI fallback)
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    
    # =========================================================================
    # Windows.Graphics.Capture API (for hardware-accelerated content)
    # This is the modern way to capture screens, works with videos/games
    # =========================================================================
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    
    # Direct3D11 for GPU-based capture
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DXCore",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    
    # WinRT interop for Graphics Capture (bridges Win32 and WinRT)
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",

    # App packaging detection (MSIX)
    "Win32_Storage_Packaging_Appx",
    
    # Globalization for language support
    "Globalization",
    
    # Security APIs for buffer handling
    "Security_Cryptography",

    # File system APIs (disk space detection for wizard)
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",

    # Child-process lifetime: a job object kills the translation engine with
    # the app however the app dies, and the toolhelp snapshot identifies
    # engines left behind by app versions that shipped before it.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",           # SECURITY_ATTRIBUTES, required by CreateJobObjectW
] }
windows-core = "0.61"      # Core Windows types
windows-version = "0.1"

# --- Image Processing ---
# For OCR image preprocessing (grayscale, contrast enhancement)
image = "0.25"
# Makes it easy to create custom error types with nice error messages
thiserror = "2"

# --- Logging ---
# For debugging - prints helpful messages to the console
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"              # Date/time for per-session log filenames
sha2 = "0.10"               # Verify app-managed engine artifacts

# --- Async Trait ---
# Allows us to use async functions in traits (Rust-specific thing)
async-trait = "0.1"

# --- IPC (Named Pipes for OverlayHost communication) ---
uuid = { version = "1.6", features = ["v4", "serde"] }
interprocess = { version = "2.2", features = ["tokio"] }

# --- HTTP Server (for browser dev mode) ---
# Axum is a lightweight async web framework for exposing APIs
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# =============================================================================
# BUILD DEPENDENCIES
# =============================================================================
# These are only used when compiling the app, not at runtime

[build-dependencies]
tauri-build = { version = "2", features = [] }

# =============================================================================
# TEST DEPENDENCIES
# =============================================================================
# These are only used when running tests (cargo test)

[dev-dependencies]
# Testing utilities for async code
tokio-test = "0.4"

# Mocking framework for unit tests
mockall = "0.14"

# Property-based testing (optional)
proptest = "1.9"

# HTTP server testing utilities
axum-test = "18.0"

# =============================================================================
# PROFILE SETTINGS
# =============================================================================
# These control how the app is compiled

[profile.release]
# When building for release, we want a small and fast binary
lto = true                 # Link-Time Optimization (slower build, faster app)
codegen-units = 1          # Better optimization (slower build)
panic = "abort"            # Smaller binary (no unwinding on crash)
strip = true               # Remove debug symbols (smaller binary)
